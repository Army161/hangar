[workspace]
resolver = "2"
members = ["crates/hangar-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Army"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sysinfo = "0.33"

[profile.release]
lto = true
codegen-units = 1
strip = true
