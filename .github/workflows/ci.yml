name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  node:
    name: Node — agent tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/

  # The 403 regression this repo shipped in 52f9db1 was invisible to the API
  # tests: /api/* stayed healthy while every asset returned Forbidden. This job
  # boots the real server and asserts the dashboard actually loads.
  smoke:
    name: Smoke — dashboard serves
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Boot agent and assert static assets
        run: |
          HANGAR_READONLY=1 node server.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7420/index.html >/dev/null && break
            sleep 1
          done

          fail=0
          for asset in index.html app.js style.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:7420/$asset")
            echo "$asset -> $code"
            [ "$code" = "200" ] || fail=1
          done

          # Traversal must still be refused.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:7420/../../../../etc/passwd")
          echo "traversal -> $code (expect 403 or 404)"
          [ "$code" = "200" ] && fail=1

          exit $fail
